name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Pint, Pest on MySQL + Redis, API docs)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: financial_import_test
          MYSQL_USER: app
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=3s --health-timeout=3s --health-retries=40
      # The dashboard tests run on the real Redis cache store (database 15).
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=3s --health-timeout=3s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      REDIS_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_mysql, redis, bcmath, intl, zip, pcntl
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('backend/composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate

      - name: Code style
        run: ./vendor/bin/pint --test

      - name: Tests (MySQL 8.4)
        run: php artisan test

      - name: API docs are up to date
        # Scramble reads the column types of the models, so it needs a migrated schema.
        env:
          DB_DATABASE: financial_import_test
        run: |
          php artisan migrate --force
          php artisan scramble:export --path=/tmp/openapi.json
          diff -u ../docs/openapi.json /tmp/openapi.json

  frontend:
    name: Frontend (type-check, Vitest, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run type-check
      - run: npm test
      - run: npx vite build

  stack:
    name: Full stack (docker compose up + real import)
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack exactly as the README says
        run: HOST_UID=$(id -u) HOST_GID=$(id -g) docker compose up -d --build --wait --wait-timeout 600

      - name: Import the sample CSV through the API and check the totals
        run: ./scripts/smoke-test.sh

      - name: Logs
        if: failure()
        run: docker compose logs --no-color app worker nginx mysql
