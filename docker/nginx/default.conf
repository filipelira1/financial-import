server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 20m;

    # Container healthcheck: nginx itself is up and serving.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Laravel: REST API, API documentation and health check.
    location ~ ^/(api|docs|up)(/|$) {
        include /etc/nginx/snippets/security-headers.conf;

        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/backend/public;
        fastcgi_read_timeout 60s;
    }

    # Vue SPA (static build). The CSP allows only same-origin scripts, styles and requests:
    # it blocks injected inline or third-party scripts and fetch/XHR to other origins, which
    # reduces (does not remove) the risk of the session token leaking through an XSS.
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
