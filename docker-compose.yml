name: financial-import

x-php: &php
  build:
    context: ./docker/php
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: financial-import-php
  volumes:
    - ./backend:/var/www/backend
  restart: unless-stopped

services:
  app:
    <<: *php
    environment:
      CONTAINER_ROLE: app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 3s
      timeout: 3s
      retries: 100
      start_period: 300s

  worker:
    <<: *php
    environment:
      CONTAINER_ROLE: worker
    command: >
      php artisan queue:work redis
      --queue=imports,default
      --tries=3 --backoff=5 --timeout=120
      --max-time=3600 --memory=256
    depends_on:
      app:
        condition: service_healthy
    # Longer than --timeout, so a stop never kills a job halfway through.
    stop_grace_period: 130s

  nginx:
    # Serves the Vue SPA (built inside the image, no Node.js needed on the host) and proxies the API.
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    image: financial-import-nginx
    ports:
      - "${APP_PORT:-8090}:80"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: financial_import
      MYSQL_USER: app
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "127.0.0.1:${MYSQL_PORT:-33070}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/app.cnf:ro
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot", "--silent"]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  mysql-data:
